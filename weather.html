<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather playlist</title>
   <link rel="icon" href="favicon.png">
<style>
  body { font-family: Arial, sans-serif; background: #fff; color: #000; margin: 10px; max-width: 760px; }
  a { color: #000; }
  .row { margin: 8px 0; }
  .small { font-size: 13px; }
  button.link { background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; cursor: pointer; color: #000; }
</style>
</head>
<body>
<div class="row small"><a href="index.html">Max's sound index!</a> | <a href="snake.html">Snake</a></div>
<div class="row">
  <b>tap in on da weather</b>
  <form id="locForm" style="display:inline">
    <input id="loc" type="text" placeholder="Your town or city" autocomplete="off" aria-label="Location">
    <select id="len" aria-label="Number of tracks">
      <option value="20">20 tracks</option>
      <option value="40">40 tracks</option>
      <option value="60">60 tracks</option>
    </select>
    <button type="submit">Make playlist</button>
  </form>
  <button id="here">Use my location</button>
</div>

<p id="status" aria-live="polite"></p>
<div id="results">
  <p>Enter your location and this page checks the current weather there, then makes a playlist to match.
  Rain gets sad songs, sunshine gets happy ones, and so on.</p>
</div>

<script>
// Last.fm API key. Only the API key goes here, never the "shared secret".
const LASTFM_API_KEY = '490d2260c0a13cc21edc04650c9e5235';

const $ = id => document.getElementById(id);
const statusEl = $('status'), resultsEl = $('results');
let ticket = 0;
let state = null;   // { place, weather, mood, pool, list, len }

/* ---------- weather (Open-Meteo, free, no key) ---------- */

async function geocode(name) {
  const url = 'https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name='
    + encodeURIComponent(name);
  const d = await (await fetch(url)).json();
  const r = d.results && d.results[0];
  if (!r) throw new Error(`Couldn't find "${name}". Try a nearby city, or add the country.`);
  return { lat: r.latitude, lon: r.longitude,
           label: [r.name, r.admin1, r.country].filter(Boolean).join(', ') };
}

async function getWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + '&current=temperature_2m,weather_code,is_day';
  const d = await (await fetch(url)).json();
  if (!d.current) throw new Error("Couldn't get the weather for that location.");
  return { code: d.current.weather_code, temp: Math.round(d.current.temperature_2m), day: !!d.current.is_day };
}

// WMO weather codes, grouped
function describe(code) {
  if (code === 0) return 'Clear sky';
  if (code <= 2) return 'Partly cloudy';
  if (code === 3) return 'Overcast';
  if (code === 45 || code === 48) return 'Fog';
  if (code >= 51 && code <= 57) return 'Drizzle';
  if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return 'Rain';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'Snow';
  if (code >= 95) return 'Thunderstorm';
  return 'Unknown weather';
}

// weather -> mood -> Last.fm tags
function moodFor(w) {
  const sky = describe(w.code);
  let mood;
  if (sky === 'Rain' || sky === 'Drizzle') mood = { name: 'sad', tags: ['sad', 'melancholy', 'rainy day', 'heartbreak'] };
  else if (sky === 'Thunderstorm') mood = { name: 'dark and intense', tags: ['dark', 'intense', 'post-rock', 'brooding'] };
  else if (sky === 'Snow') mood = { name: 'cosy', tags: ['cozy', 'winter', 'acoustic', 'warm'] };
  else if (sky === 'Fog') mood = { name: 'dreamy', tags: ['dream pop', 'ambient', 'ethereal', 'atmospheric'] };
  else if (sky === 'Overcast') mood = { name: 'mellow', tags: ['mellow', 'chill', 'calm', 'indie folk'] };
  else if (!w.day) mood = { name: 'calm night-time', tags: ['night', 'chill', 'late night', 'dreamy'] };
  else mood = { name: 'happy', tags: ['happy', 'feel good', 'upbeat', 'sunshine'] };
  // temperature nudges
  if (w.temp >= 28 && mood.name === 'happy') mood.tags.push('summer');
  if (w.temp <= 5 && !mood.tags.includes('winter')) mood.tags.push('winter');
  return mood;
}

/* ---------- music (Last.fm tags) ---------- */

async function tagTracks(tag) {
  const page = 1 + Math.floor(Math.random() * 3);   // vary which songs come up
  const qs = new URLSearchParams({ method: 'tag.gettoptracks', tag, limit: 100, page,
                                   api_key: LASTFM_API_KEY, format: 'json' });
  try {
    const d = await (await fetch('https://ws.audioscrobbler.com/2.0/?' + qs)).json();
    return ((d.tracks && d.tracks.track) || []).map(t => ({ artist: t.artist.name, track: t.name }));
  } catch { return []; }
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// pick tracks: no repeats, at most 2 per artist, never the same artist twice in a row
function pick(pool, len) {
  const seen = new Set(), perArtist = new Map(), out = [];
  let rest = shuffle(pool);
  while (out.length < len && rest.length) {
    const next = [];
    for (const t of rest) {
      if (out.length >= len) break;
      const key = (t.artist + '|' + t.track).toLowerCase();
      const a = t.artist.toLowerCase();
      if (seen.has(key) || (perArtist.get(a) || 0) >= 2) continue;
      if (out.length && out[out.length - 1].artist.toLowerCase() === a) { next.push(t); continue; }
      seen.add(key); perArtist.set(a, (perArtist.get(a) || 0) + 1); out.push(t);
    }
    if (next.length === rest.length) break;
    rest = next;
  }
  return out;
}

/* ---------- flow ---------- */

async function make(where) {
  const t = ++ticket;
  const len = +$('len').value;
  statusEl.textContent = 'Checking the weather…';
  const place = where.label ? where : await geocode(where.name);
  const weather = await getWeather(place.lat, place.lon);
  if (t !== ticket) return;
  const mood = moodFor(weather);
  statusEl.textContent = `Finding ${mood.name} songs…`;
  const lists = await Promise.all(mood.tags.map(tagTracks));
  if (t !== ticket) return;
  const pool = lists.flat();
  if (!pool.length) throw new Error("Couldn't reach Last.fm. Check your connection and try again.");
  state = { place, weather, mood, pool, len, list: pick(pool, len) };
  document.title = `${mood.name} playlist for ${place.label}`;
  statusEl.textContent = '';
  render();
}

function render() {
  const s = state;
  resultsEl.innerHTML = '';
  const h = document.createElement('h2');
  h.textContent = `A ${s.mood.name} playlist`;
  const w = document.createElement('p');
  w.textContent = `${describe(s.weather.code)}, ${s.weather.temp}°C in ${s.place.label}.`;

  const bar = document.createElement('div');
  bar.className = 'row';
  const shuf = document.createElement('button');
  shuf.textContent = 'Shuffle';
  shuf.addEventListener('click', () => { s.list = pick(s.pool, s.len); render(); });
  const copy = document.createElement('button');
  copy.textContent = 'Copy as text';
  copy.addEventListener('click', copyList);
  bar.append(`${s.list.length} tracks `, shuf, ' ', copy);

  const help = document.createElement('p');
  help.className = 'small';
  help.innerHTML = 'To make this a Spotify, Apple Music or YouTube playlist, copy it and paste it into '
    + '<a href="https://www.tunemymusic.com" target="_blank" rel="noopener">TuneMyMusic</a> or '
    + '<a href="https://soundiiz.com" target="_blank" rel="noopener">Soundiiz</a>.';

  const ol = document.createElement('ol');
  s.list.forEach((x, i) => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(x.artist + ' ' + x.track);
    a.target = '_blank'; a.rel = 'noopener';
    a.textContent = `${x.artist} - ${x.track}`;
    const rm = document.createElement('button');
    rm.className = 'link small';
    rm.textContent = 'Remove';
    rm.setAttribute('aria-label', `Remove ${x.track}`);
    rm.addEventListener('click', () => { s.list.splice(i, 1); render(); });
    li.append(a, ' ', rm);
    ol.append(li);
  });
  resultsEl.append(h, w, bar, help, ol);
}

async function copyList() {
  const text = state.list.map(x => `${x.artist} - ${x.track}`).join('\n');
  try {
    await navigator.clipboard.writeText(text);
    statusEl.textContent = `Copied ${state.list.length} tracks.`;
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.rows = 10; ta.style.width = '100%';
    resultsEl.append(ta); ta.select();
    statusEl.textContent = 'Select the text below and copy it.';
  }
}

function showError(err) {
  statusEl.textContent = /fetch|network|load failed/i.test(err.message)
    ? "Couldn't reach the weather or music service. Check your connection and try again."
    : err.message;
}

$('locForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('loc').value.trim();
  if (v) make({ name: v }).catch(showError);
});

$('here').addEventListener('click', () => {
  if (!navigator.geolocation) { statusEl.textContent = "Your browser can't share its location. Type a city instead."; return; }
  statusEl.textContent = 'Asking your browser for your location…';
  navigator.geolocation.getCurrentPosition(
    p => make({ lat: p.coords.latitude, lon: p.coords.longitude, label: 'your location' }).catch(showError),
    () => { statusEl.textContent = "Couldn't get your location. Type a city instead."; },
    { timeout: 10000 }
  );
});
</script>
</body>
</html>
